name: Build Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: go build -o familyguard-server ./cmd/server/main.go

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-server-linux-amd64
          path: backend/familyguard-server
