# FamilyGuard 本地开发环境
# docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: family_guard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: postgres -c shared_buffers=128MB

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: family_guard
      JWT_SECRET: local-dev-secret-key-123
      SERVER_PORT: 8080
      GIN_MODE: debug
    volumes:
      - ./web-admin:/app/web-admin
    depends_on:
      - postgres

volumes:
  pgdata:
